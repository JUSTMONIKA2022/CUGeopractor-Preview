# 行至大地·CUGeopractor —— Docker Compose 编排
# 安全要点：端口仅绑定 127.0.0.1（本机回环），禁止随意改为 0.0.0.0 对外暴露；
#          数据目录（配置/密钥/知识库）通过卷挂载到宿主机 ./data，持久化且不入镜像。

services:
  cugeopractor:
    build: .
    container_name: cugeopractor
    restart: unless-stopped
    ports:
      # 仅本机可访问；如需局域网使用请自行评估风险并修改
      - "127.0.0.1:8080:8080"
    volumes:
      # 宿主机 ./data 与容器 /app/data 双向挂载（密钥、向量库、会话、知识库）
      - ./data:/app/data
    env_file:
      # .env 已在 .gitignore 中排除，不会进入镜像层
      - .env
    environment:
      # 确保容器内 Web 服务仍只监听本机回环
      HOST: 127.0.0.1
      PORT: 8080
